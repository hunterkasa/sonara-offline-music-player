name: sonara
description: "A premium offline music player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  material_color_utilities: ^0.13.0
  intl: ^0.20.2
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  permission_handler: 11.3.1
  device_info_plus: ^13.3.0
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.25.0
  build_runner: ^2.4.15
  just_audio_platform_interface: ^4.6.0

flutter:
  generate: true
  uses-material-design: true
